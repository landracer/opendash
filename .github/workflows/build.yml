# OpenDash build-smoke CI
#
# What this does: on every push/PR to main (and manual runs), it spins up a
# clean Linux container with ESP-IDF, checks out the repo, and runs
# `idf.py build` for EVERY node project in the fleet. No hardware needed.
# It answers one question automatically: "did my change break the build
# on some node I didn't test locally?"
#
# Matrix covers all twelve node families: the six ESP32-S3 display nodes
# (esp32s3 target) and the five classic-ESP32 controller nodes + openDstream
# (esp32 target — WROOM-32E boards).
#
# Notes:
#  - Local fleet is pinned to an IDF v6.1 *dev snapshot*
#    (v6.1-dev-2441-gffb63db38b, see BUILD_DEPENDENCIES.md); CI uses the
#    v6.1 release line. If a build only fails in CI, suspect a
#    dev-vs-release IDF delta, not your code.
#  - The generated LVGL C sources are NOT committed (nested "do not commit"
#    .gitignore files — deliberate, single source of truth is the .ttf/.png
#    originals). The "Generate assets" step below installs the real converter
#    toolchain on the runner and runs both converters BEFORE the IDF build
#    container starts; the container mounts the generated sources. (The old
#    mechanism — an OD_PREGENERATED_ASSETS job env meant to skip converters
#    because "assets are committed" — was doubly false: nothing was committed,
#    and the env never reached the build container anyway. Owner decision D1:
#    converters-in-CI is the ratified mode. docs/gameplan-aduit.md §3.)
#  - `dependencies.lock` is committed for every project, so component
#    versions resolve identically on every runner.
name: build-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # keep building other nodes when one fails
      matrix:
        # each include entry = one matrix job (project dir + its IDF target,
        # read from that project's sdkconfig.defaults CONFIG_IDF_TARGET)
        include:
          - { node: center,       target: esp32s3 }
          - { node: left,         target: esp32s3 }
          - { node: right,        target: esp32s3 }
          - { node: gps,          target: esp32s3 }
          - { node: pod1,         target: esp32s3 }
          - { node: pod2,         target: esp32s3 }
          - { node: openDstream,  target: esp32   }
          - { node: mos-4ch-a,    target: esp32   }
          - { node: mos-4ch-b,    target: esp32   }
          - { node: relay-4ch-hd, target: esp32   }
          - { node: relay-8ch-a,  target: esp32   }
          - { node: relay-8ch-b,  target: esp32   }
    name: build ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      # D1 ratified 2026-10-07: converters are part of CI (Option A). Install
      # the real toolchain on the runner, then generate the LVGL C sources from
      # the ttf/png sources before the IDF build container ever runs.
      - name: Install asset-converter toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick nodejs npm python3-pil

      - name: Generate LVGL font and image C sources from ttf and png originals
        run: |
          (cd common/fonts && npm install --no-audit --no-fund)
          python3 common/fonts/convert_fonts.py
          python3 common/images/convert_images.py

      - name: Build ${{ matrix.node }} (ESP-IDF v6.1)
        run: |
          docker run -t -e IDF_TARGET="${{ matrix.target }}" \
            -v "$GITHUB_WORKSPACE:/app/$GITHUB_REPOSITORY" \
            -w "/app/$GITHUB_REPOSITORY/${{ matrix.node }}" \
            espressif/idf:v6.1 \
            /bin/bash -c 'git config --global --add safe.directory "*" && idf.py build'

      - name: Upload firmware artifacts (${{ matrix.node }})
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.node }}
          path: |
            ${{ matrix.node }}/build/*.bin
            ${{ matrix.node }}/build/*.elf
            ${{ matrix.node }}/build/flasher_args.json
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # docs-lint — cheap always-on docs guard. Fails the build on a broken
  # relative markdown link, a missing license header on a tracked source
  # file, or a doc referencing a file that does not exist.
  # ---------------------------------------------------------------------------
  docs-lint:
    runs-on: ubuntu-latest
    name: docs-lint
    steps:
      - uses: actions/checkout@v4
      - name: Link / license / structure checks
        run: bash scripts/check_docs.sh

  # ---------------------------------------------------------------------------
  # unit-tests — host-side (no hardware, no ESP-IDF) C unit tests for the
  # pure-logic core: protocol codec, channel routing, node health math,
  # parachute config sanitization, DP domain partitioning. See test/.
  # ---------------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    name: unit-tests (host)
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the host test harness
        run: |
          cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build test/build -j
          ctest --test-dir test/build --output-on-failure